  download(`feelings-journal-backup-${todayKey()}.json`, JSON.stringify({ v:1, app:'feelings-journal', exported:new Date().toISOString(), days:S.days, custom:S.custom }, null, 2), 'application/json');
}
function restore(file){
  file.text().then(t => {
    const j = JSON.parse(t);
    if (!j || j.v !== 1 || j.app !== 'feelings-journal' || typeof j.days !== 'object') throw 0;
    const days = cleanDays(j.days); const n = Object.keys(days).length;
    cleanCustom(j.custom).forEach(c => { if (!S.custom.some(x => x.t === c.t)) S.custom.push(c); });
    if (!n) throw 0;
    Object.entries(days).forEach(([d, day]) => { const cur = S.days[d]; if (!cur || day.updated >= cur.updated) { day.synced = false; S.days[d] = day; S.dirty[d] = 1; } });
    saveNow(); scheduleSync(); UI.step = null; render(); Sound.play('open'); toast(`Restored ${n} ${n === 1 ? 'day' : 'days'}.`);
  }).catch(() => { Sound.play('error'); toast('This file could not be read.'); });
}

/* ================= events ================= */
function newDate(k){ stopBreath(); UI.date = k; UI.step = null; UI.open = null; UI.panel = null; UI.idx.choose = 0; UI.idx.card = 0; render(); }
const ACTS = {
  tab: b => { if (UI.tab !== b.dataset.tab) Sound.play('tab'); go(b.dataset.tab); },
  pick: b => { const f = F[b.dataset.id], on = togglePick(f.id); b.setAttribute('aria-pressed', on);
    Sound.play(on ? 'pick' : 'unpick', f.ch); if (on) { sparkle(b); setTimeout(() => showAsk(f.id, b), 280); } else closeAsk(true); CHROME.choose(); },
  askStay: b => { const box = b.closest('.ask'), it = S.days[UI.date].items[box.dataset.id]; it.stay = b.dataset.v; touch(UI.date);
    Sound.play('chipOn'); toast(`${F[box.dataset.id].name} · ${STAY[b.dataset.v]}`); closeAsk(); },
  askSkip: () => { closeAsk(); Sound.play('chipOff'); },
  prev: b => setSlide(b.dataset.slider, UI.idx[b.dataset.slider] - 1),
  next: b => setSlide(b.dataset.slider, UI.idx[b.dataset.slider] + 1),
  go: b => setSlide(b.dataset.slider, +b.dataset.i),
  toChoose: () => { stopBreath(); UI.step = 'choose'; renderToday(); Sound.play('open'); },
  stage: b => { const v = b.dataset.v; if (v === UI.step && !UI.open && !UI.panel) return; if (v !== 'arrive') stopBreath(); UI.open = null; UI.panel = null; document.body.classList.remove('hush');
    UI.step = v; renderToday(); Sound.play(v === 'day' ? 'open' : 'tab'); },
  openCard: b => { UI.panel = null; openCard(b.dataset.id); },
  gpan: b => Garden.pan(+b.dataset.d),
  findVisitor: b => Garden.find(b.dataset.k),
  ghintOk: () => Garden.hint(false),
  view: b => { UI.view = P.view = b.dataset.v; savePrefs(); renderToday(); Sound.play('tab'); },
  panel: b => { UI.panel = b.dataset.v; UI.open = null; renderToday(); Sound.play('open'); },
  closePanel,
  env: b => { const d = getDay(UI.date, true), arr = d.env[b.dataset.g], v = b.dataset.v, i = arr.indexOf(v); i >= 0 ? arr.splice(i, 1) : arr.push(v);
    b.setAttribute('aria-pressed', i < 0); touch(UI.date); Sound.play(i >= 0 ? 'chipOff' : 'chipOn'); },
  word: b => { const d = getDay(UI.date, true), t = b.dataset.t, i = d.words.indexOf(t); i >= 0 ? d.words.splice(i, 1) : d.words.push(t);
    b.setAttribute('aria-pressed', i < 0); touch(UI.date); if (i < 0) Sound.play('pick', WORDS.find(gr => gr.items.includes(t) || S.custom.some(c => c.t === t && c.g === gr.id))?.ch || 'heart'); else Sound.play('chipOff'); },
  wGroup: b => { UI.wGroup = b.dataset.v; b.parentElement.querySelectorAll('button').forEach(x => x.setAttribute('aria-pressed', x === b)); },
  wordAdd: () => { const inp = $('wNew'), t = inp.value.trim().slice(0, 200); if (!t) { toast('Write your words first.'); return; }
    if (!S.custom.some(c => c.t === t)) S.custom.push({ g:UI.wGroup, t }); const d = getDay(UI.date, true); if (!d.words.includes(t)) d.words.push(t);
    touch(UI.date); renderToday(); Sound.play('pick', 'heart'); toast('Added and hung as a lantern.'); },
  wordDel: b => { const t = b.dataset.t; S.custom = S.custom.filter(c => c.t !== t); saveNow(); renderToday(); Sound.play('remove'); },
  closeCard,
  strength: b => { const it = S.days[UI.date].items[b.dataset.id], v = +b.dataset.v; it.strength = it.strength === v ? 0 : v; touch(UI.date);
    updateBoxButtons(b.closest('[data-box]'), 'strength', b.dataset.id); it.strength ? Sound.play('level', F[b.dataset.id].ch, v) : Sound.play('chipOff'); },
  when: b => { const it = S.days[UI.date].items[b.dataset.id], v = b.dataset.v, i = it.when.indexOf(v); i >= 0 ? it.when.splice(i, 1) : it.when.push(v);
    it.when.sort((a,c) => WHEN.indexOf(a) - WHEN.indexOf(c)); touch(UI.date); updateBoxButtons(b.closest('[data-box]'), 'when', b.dataset.id); Sound.play(i >= 0 ? 'chipOff' : 'chipOn'); },
  stay: b => { const it = S.days[UI.date].items[b.dataset.id], off = it.stay === b.dataset.v; it.stay = off ? '' : b.dataset.v; touch(UI.date);
    updateBoxButtons(b.closest('[data-box]'), 'stay', b.dataset.id); Sound.play(off ? 'chipOff' : 'chipOn'); },
  prevDay: () => newDate(addDays(UI.date, -1)),
  nextDay: () => { if (UI.date < todayKey()) newDate(addDays(UI.date, 1)); },
  todayDay: () => newDate(todayKey()),
  breathe, done,
  openCh: b => { UI.idx.chakras = CH[b.dataset.ch].i + 1; Sound.play('tab'); go('chakras'); },
  range: b => { UI.range = b.dataset.v === 'all' ? 'all' : +b.dataset.v; renderLook(); },
  openDay: b => { UI.date = b.dataset.v; UI.step = null; UI.open = null; Sound.play('open'); go('today'); },
  syncNow: () => { if (P.url) sync(true); else go('settings'); },
  sound: () => { P.sound = !P.sound; savePrefs(); renderTop(); if (UI.tab === 'settings') renderSettings(); if (P.sound) { Sound.play('chipOn'); Garden.ambient(); } else { Sound.breath('end'); Sound.ambStop(); } },
  soundSet: b => { P.sound = b.dataset.v === 'on'; savePrefs(); renderTop(); renderSettings(); if (P.sound) Sound.play('chipOn'); else Sound.ambStop(); },
  sky: b => { P.sky = b.dataset.v; savePrefs(); Sky.change(); renderSettings(); Sound.play('welcome'); },
  connect: () => {
    const url = $('sheetUrl').value.trim(), key = $('sheetKey').value.trim();
    if (!validUrl(url)) { Sound.play('error'); toast('That does not look like an Apps Script web app URL.'); return; }
    if (!key) { Sound.play('error'); toast('Please add your passphrase.'); return; }
    P.url = url; P.key = key; savePrefs();
    Object.keys(S.days).forEach(d => { if (!S.days[d].synced && S.days[d].order.length) S.dirty[d] = 1; });
    saveNow(); sync(true); toast('Connecting…');
  },
  disconnect: () => { P.url = ''; P.key = ''; P.lastSync = 0; savePrefs(); setSync('local'); renderSettings(); toast('This device is no longer connected.'); },
  copyScript: () => { navigator.clipboard?.writeText(SHEET_SCRIPT).then(() => toast('Script copied.'), () => toast('Select the text below and copy it.')); },
  csv: exportCsv, backup,
  restore: () => $('restoreFile').click(),
  wipe: b => {
    if (!b.dataset.armed){ b.dataset.armed = 1; b.textContent = 'Tap again to wipe everything here'; Sound.play('error'); setTimeout(() => { if (b.isConnected){ delete b.dataset.armed; b.textContent = 'Wipe this device'; } }, 4000); return; }
    store.clear(KEY); store.clear(PKEY); S = { v:1, days:{}, dirty:{}, custom:[] }; P = { url:'', key:'', sky:'drift', sound:true, lastSync:0, view:'garden', sheetV:1, gardenHint:0 }; UI.view = 'garden';
    Sky.change(); setSync('local'); UI.step = null; renderTop(); renderSettings(); Sound.play('remove'); toast('This device has been wiped.');
  },
};
// actions that make their own sound; everything else gets a soft tap
const QUIET = new Set(['gpan','findVisitor','tab','pick','prev','next','go','toChoose','stage','openCard','closeCard','askStay','askSkip','view','panel','closePanel','env','word','wordAdd','wordDel','strength','when','stay','breathe','done','openCh','openDay','sound','soundSet','sky','connect','wipe','syncNow']);

// swiping between slides
let drag = null, swallow = false;
document.addEventListener('pointerdown', e => {
  const sl = e.target.closest('.slider'); if (!sl || e.button > 0 || e.target.closest('input,textarea')) return;
  drag = { sl, name:sl.dataset.slider, x:e.clientX, y:e.clientY, dx:0, moved:false };
});
document.addEventListener('pointermove', e => {
  if (!drag) return;
  const dx = e.clientX - drag.x, dy = e.clientY - drag.y;
  if (!drag.moved && Math.abs(dx) > 12 && Math.abs(dx) > Math.abs(dy) * 1.3) { drag.moved = true; drag.sl.firstElementChild.classList.add('dragging'); }
  if (drag.moved){ drag.dx = dx; const n = slideCount(drag.name), i = UI.idx[drag.name], edge = (i === 0 && dx > 0) || (i === n - 1 && dx < 0);
    drag.sl.firstElementChild.style.transform = `translateX(calc(${-i*100}% + ${edge ? dx*.3 : dx}px))`; }
});
function endDrag(){
  if (!drag) return; const d = drag; drag = null;
  if (!d.moved) return;
  d.sl.firstElementChild.classList.remove('dragging'); swallow = true; setTimeout(() => swallow = false, 60);
  if (Math.abs(d.dx) > Math.min(70, d.sl.offsetWidth * .18)) setSlide(d.name, UI.idx[d.name] + (d.dx < 0 ? 1 : -1)); else applySlide(d.name);
}
document.addEventListener('pointerup', endDrag);
document.addEventListener('pointercancel', () => { if (drag && drag.moved){ drag.sl.firstElementChild.classList.remove('dragging'); applySlide(drag.name); } drag = null; });
document.addEventListener('click', e => { if (swallow){ e.preventDefault(); e.stopPropagation(); swallow = false; } }, true);

document.addEventListener('click', e => {
  const b = e.target.closest('[data-act]'); if (!b || b.disabled) return;
  const act = b.dataset.act; if (!ACTS[act]) return;
  ACTS[act](b);
  if (!QUIET.has(act)) Sound.play('tap');
});
document.addEventListener('click', e => { if (e.target.classList && e.target.classList.contains('ask')) closeAsk(); });
document.addEventListener('keydown', e => {
  const ask = document.querySelector('.ask');
  if (ask && e.key === 'Tab'){ const f = [...ask.querySelectorAll('button')], i = f.indexOf(document.activeElement);
    if (e.shiftKey && i <= 0){ f[f.length-1].focus(); e.preventDefault(); } else if (!e.shiftKey && i === f.length - 1){ f[0].focus(); e.preventDefault(); } }
});
document.addEventListener('keydown', e => {
  if (e.target.closest && e.target.closest('input,textarea') || e.altKey || e.metaKey || e.ctrlKey) return;
  if (e.key === 'Escape' && document.querySelector('.ask')){ closeAsk(); return; }
  if (document.querySelector('.ask')) return;
  if (e.key === 'Escape' && UI.open){ closeCard(); return; }
  if (e.key === 'Escape' && UI.panel){ closePanel(); return; }
  const name = activeSlider(); if (!name) return;
  if (e.key === 'ArrowRight'){ setSlide(name, UI.idx[name] + 1); e.preventDefault(); }
  if (e.key === 'ArrowLeft'){ setSlide(name, UI.idx[name] - 1); e.preventDefault(); }
});
document.addEventListener('input', e => {
  const t = e.target;
  if (t.dataset && 'envnote' in t.dataset){ const d = getDay(UI.date, true); d.env.note = t.value.slice(0, 2000); touch(UI.date); return; }
  if (!t.dataset || !t.dataset.field) return;
  const d = S.days[UI.date]; if (!d || !d.items[t.dataset.id]) return;
  d.items[t.dataset.id][t.dataset.field] = t.value; touch(UI.date);
});
document.addEventListener('focusin', e => { if (e.target.matches && e.target.matches('textarea,input[data-field],#wNew')) document.body.classList.add('hush'); });
document.addEventListener('focusout', () => { setTimeout(() => { if (!typing()) document.body.classList.remove('hush'); }, 60); });
document.addEventListener('focusout', () => setTimeout(() => { if (UI.pendingRefresh && !typing()){ UI.pendingRefresh = false; render(); } }, 50));
$('restoreFile').addEventListener('change', e => { const f = e.target.files[0]; if (f) restore(f); e.target.value = ''; });
function checkNewDay(){
  const t = todayKey();
  if (UI.lastSeenDay !== t){ const wasToday = UI.date === UI.lastSeenDay; UI.lastSeenDay = t;
    if (wasToday && UI.tab === 'today' && !typing()) newDate(t); else renderTop(); }
}
addEventListener('visibilitychange', () => {
  if (document.hidden){ saveNow(); Sound.ambStop(); if (P.url && Object.keys(S.dirty).length) sync(); }
  else { checkNewDay(); Garden.ambient(); }
});
setInterval(checkNewDay, 60000);
addEventListener('online', () => { if (P.url) sync(); });
addEventListener('pagehide', saveNow);
addEventListener('resize', () => { const n = activeSlider(); if (n) applySlide(n, true); });

/* ================= Google Sheet script (copied from apps-script.gs) ================= */
const SHEET_SCRIPT = /*APPS_SCRIPT*/"/*\n  Feelings journal \u2013 Google Sheet connector\n  -----------------------------------------\n  Paste this whole file into Extensions \u203a Apps Script in your Google Sheet.\n  1. Change PASSPHRASE below to your own phrase (the app asks for the same one).\n  2. Deploy \u203a New deployment \u203a Web app. Execute as: Me. Who has access: Anyone.\n  3. Copy the Web app URL (it ends in /exec) into the app's Settings.\n  \"Anyone\" only means the app can reach the script; without the passphrase\n  nobody can read or write anything.\n*/\nconst PASSPHRASE = 'change-this-to-your-own-phrase';\nconst SHEET_NAME = 'Feelings';\nconst HEAD = ['Date', 'Feeling', 'Chakra', 'Open or protective', 'Strength (1-5)',\n              'When', 'Why', 'Thoughts', 'Let it stay?', 'Entry ID', 'Updated',\n              'Around me', 'What I told myself', 'Words to hold'];\nconst VERSION = 2;\n\nfunction doPost(e) {\n  let out;\n  try {\n    const body = JSON.parse(e.postData.contents);\n    if (PASSPHRASE === 'change-this-to-your-own-phrase') throw new Error('Set your own PASSPHRASE in the script first');\n    if (body.key !== PASSPHRASE) throw new Error('Wrong passphrase');\n    const lock = LockService.getScriptLock();\n    lock.waitLock(20000);\n    try {\n      const sh = getSheet_();\n      if (body.action === 'sync' && Array.isArray(body.days) && body.days.length) writeDays_(sh, body.days);\n      out = { ok: true, v: VERSION, rows: readRows_(sh) };\n    } finally { lock.releaseLock(); }\n  } catch (err) {\n    out = { ok: false, error: String((err && err.message) || err) };\n  }\n  return ContentService.createTextOutput(JSON.stringify(out)).setMimeType(ContentService.MimeType.JSON);\n}\n\nfunction doGet() {\n  return ContentService.createTextOutput('The Feelings journal connector is running.');\n}\n\nfunction getSheet_() {\n  const ss = SpreadsheetApp.getActiveSpreadsheet();\n  let sh = ss.getSheetByName(SHEET_NAME);\n  if (!sh) {\n    sh = ss.insertSheet(SHEET_NAME);\n    sh.setFrozenRows(1);\n  }\n  const head = sh.getRange(1, 1, 1, HEAD.length);\n  if (head.getValues()[0].join('|') !== HEAD.join('|')) head.setValues([HEAD]).setFontWeight('bold');\n  return sh;\n}\n\nfunction dateKey_(v) {\n  return v instanceof Date ? Utilities.formatDate(v, Session.getScriptTimeZone(), 'yyyy-MM-dd') : String(v);\n}\n\nfunction readRows_(sh) {\n  const n = sh.getLastRow();\n  if (n < 2) return [];\n  return sh.getRange(2, 1, n - 1, HEAD.length).getValues().map(function (r) { r[0] = dateKey_(r[0]); return r; });\n}\n\n// Each day sent by the app replaces all rows of that date (an empty day removes them).\nfunction writeDays_(sh, days) {\n  const replace = {};\n  days.forEach(function (d) { if (d && /^\\d{4}-\\d{2}-\\d{2}$/.test(d.date)) replace[d.date] = d; });\n  const keep = readRows_(sh).filter(function (r) { return !replace[r[0]]; });\n  const fresh = [];\n  Object.keys(replace).forEach(function (k) {\n    (replace[k].rows || []).forEach(function (r) {\n      if (Array.isArray(r) && (r.length === HEAD.length || r.length === 11)) {\n        while (r.length < HEAD.length) r.push('');\n        fresh.push(r.map(clean_));\n      }\n    });\n  });\n  const all = keep.concat(fresh).sort(function (a, b) { return a[0] < b[0] ? -1 : a[0] > b[0] ? 1 : 0; });\n  const n = sh.getLastRow();\n  if (n > 1) sh.getRange(2, 1, n - 1, HEAD.length).clearContent();\n  if (all.length) {\n    sh.getRange(2, 1, all.length, 1).setNumberFormat('@');\n    sh.getRange(2, 1, all.length, HEAD.length).setValues(all);\n  }\n}\n\n// Text that starts like a formula is stored as plain text.\nfunction clean_(v) {\n  if (v === null || v === undefined) return '';\n  if (typeof v === 'string') {\n    v = v.slice(0, 5000);\n    if (/^[=+\\-@]/.test(v)) v = \"'\" + v;\n  }\n  return v;\n}\n";

/* ================= start ================= */
loadAll(); makeDefs(); Sky.init();
render(); setSync(P.url ? (navigator.onLine ? (P.lastSync ? 'ok' : 'local') : 'offline') : 'local');
if (P.url) sync();
if ('serviceWorker' in navigator && location.protocol.startsWith('http')) navigator.serviceWorker.register('sw.js').catch(() => {});
