*{box-sizing:border-box}
html{touch-action:manipulation;-webkit-text-size-adjust:100%;height:100%}
body{margin:0;height:100%;height:100dvh;overflow:hidden;background:#1c1030;color:var(--text);font:400 1rem/1.5 var(--font);
  display:grid;grid-template-rows:auto minmax(0,1fr) auto;grid-template-columns:minmax(0,1fr);
  padding:env(safe-area-inset-top) env(safe-area-inset-right) 0 env(safe-area-inset-left)}
button{font:inherit;color:inherit;cursor:pointer;min-height:40px;-webkit-tap-highlight-color:transparent}
button:disabled{cursor:default}
:focus-visible{outline:3px solid #fff;outline-offset:2px}
input,textarea{font:inherit;font-size:16px;color:var(--text);background:var(--field);border:1px solid var(--line);border-radius:var(--r-s);padding:.6rem .8rem;width:100%}
input::placeholder,textarea::placeholder{color:var(--faint)}
textarea{resize:vertical;min-height:2.9rem;line-height:1.35;padding:.5rem .75rem}
input:focus,textarea:focus{outline:none;border-color:rgba(255,255,255,.55);box-shadow:0 0 0 3px rgba(255,255,255,.15)}
h1,h2,h3{font-family:var(--font);font-weight:800;line-height:1.2;margin:0;letter-spacing:-.01em}
p{margin:.4rem 0}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.muted{color:var(--muted)} .small{font-size:.875rem}
.center{justify-content:center;text-align:center}

/* ================= the sky ================= */
#neb,#stars,.veil{position:fixed;inset:0;width:100%;height:100%;pointer-events:none}
#neb{z-index:-3;filter:blur(26px) saturate(1.2);transform:scale(1.15)}
#stars{z-index:-2}
.veil{z-index:-1;background:radial-gradient(120% 90% at 50% 40%,transparent 40%,rgba(8,4,18,.45))}

/* ================= glass ================= */
.glass{background:var(--glass);-webkit-backdrop-filter:blur(18px) saturate(150%);backdrop-filter:blur(18px) saturate(150%);
  border-radius:var(--r-l);box-shadow:inset 0 1px 0 rgba(255,255,255,.16),0 12px 40px rgba(5,2,15,.28)}
.btn{border:0;border-radius:999px;padding:.6rem 1.1rem;background:var(--glass-3);color:var(--text);font-weight:700;min-height:50px;
  display:inline-flex;align-items:center;justify-content:center;gap:.4rem;min-width:0;
  -webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px);transition:transform .3s var(--spring),background .2s,opacity .2s}
.btn:hover:not(:disabled){background:rgba(255,255,255,.22)}
.btn:active:not(:disabled){transform:scale(.95)}
.btn.primary{background:linear-gradient(135deg,var(--accent),var(--accent-2));color:var(--on-accent);box-shadow:0 6px 26px rgba(246,163,203,.35)}
.btn:disabled{opacity:.38}
.btn .lbl{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.linkbtn{background:none;border:0;color:var(--text);opacity:.85;font-size:.85rem;text-decoration:underline;text-underline-offset:3px;padding:0 6px;min-height:40px}

/* ================= top bar ================= */
.top{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:8px 16px 6px;width:100%;max-width:920px;margin:0 auto}
.topl{display:flex;align-items:center;gap:6px;min-width:0}
.title{font-size:1.3rem;font-weight:800;text-shadow:0 2px 12px rgba(0,0,0,.4)}
.tdate{display:flex;align-items:center;gap:4px}
.tdate .d{display:flex;flex-direction:column;align-items:center;line-height:1.15;min-width:8.2rem;text-shadow:0 2px 12px rgba(0,0,0,.4)}
.greet{font-size:.8rem;color:var(--muted)}
.tdate b{font-size:1.1rem;font-weight:800}
.round{width:44px;height:44px;border-radius:50%;border:0;background:var(--glass-2);font-size:1.3rem;line-height:1;flex:none;display:grid;place-items:center}
.round:disabled{opacity:.3}
.topr{display:flex;align-items:center;gap:6px}
.chip-sync{border:0;background:var(--glass-2);border-radius:999px;padding:0 12px;min-height:44px;font-size:.8rem;color:var(--muted);display:inline-flex;align-items:center;gap:.45rem;white-space:nowrap}
.chip-sync .cloud{display:none}
.chip-sync .dot{width:8px;height:8px;border-radius:50%;background:var(--faint);flex:none}
.chip-sync[data-s="ok"] .dot{background:var(--ok);box-shadow:0 0 8px var(--ok)}
.chip-sync[data-s="syncing"] .dot{background:var(--c-solar);animation:blinkdot 1s infinite}
.chip-sync[data-s="error"] .dot,.chip-sync[data-s="offline"] .dot{background:var(--warn)}
@keyframes blinkdot{50%{opacity:.3}}
.mini-today{font-size:.8rem;border:0;background:var(--glass-2);border-radius:999px;padding:0 10px;min-height:40px}

/* ================= screens and slides ================= */
main{position:relative;min-height:0;width:100%;max-width:920px;margin:0 auto}
.screen{position:absolute;inset:0;display:flex;flex-direction:column;padding:0 16px;min-height:0}
.screen[hidden]{display:none}
.screen.enter{animation:fadeUp .5s var(--ease) both}
@keyframes fadeUp{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
.solo{flex:1;min-height:0;overflow-y:auto;padding-bottom:12px}
.stepper{display:flex;flex-wrap:wrap;justify-content:center;gap:2px;padding:2px 0 8px}
.step{min-width:40px;height:46px;border:0;background:transparent;border-radius:16px;display:grid;place-items:center;padding:0 3px;transition:background .2s}
.step .sd{width:28px;height:28px;border-radius:50%;display:grid;place-items:center;font-size:.8rem;font-weight:800;color:#2A1530;
  background:radial-gradient(circle at 35% 30%,#fff 0 7%,var(--c) 58%,color-mix(in srgb,var(--c) 70%,#000));transition:transform .4s var(--spring),box-shadow .3s}
.step[aria-current="true"]{background:var(--glass-3)}
.step[aria-current="true"] .sd{transform:scale(1.22);box-shadow:0 0 0 2px rgba(255,255,255,.85),0 0 18px var(--c)}
.step .blob{width:36px;height:36px;transition:transform .4s var(--spring)}
.step[aria-current="true"] .blob{transform:scale(1.18)}
.step .sd.star{background:radial-gradient(circle at 35% 30%,#fff 0 10%,#FFE3A3 50%,#F6A3CB);font-size:.95rem}
.step.add{font-size:1.3rem;color:var(--muted)}
.slider{flex:1;min-height:0;overflow:hidden;touch-action:pan-y pinch-zoom;border-radius:var(--r-l)}
.track{display:flex;height:100%;transition:transform .6s var(--glide);will-change:transform}
.track.instant,.track.dragging{transition:none}
.slide{flex:0 0 100%;min-width:0;height:100%;overflow-y:auto;touch-action:pan-y pinch-zoom;overscroll-behavior:contain;padding:0 2px 4px;scrollbar-width:thin;scrollbar-color:rgba(255,255,255,.25) transparent}
.slide>.panel{min-height:100%}
.panel{padding:12px 14px 14px}
.pager{display:flex;gap:8px;padding:10px 0 12px;align-items:center}
.pager>.btn{flex:1 1 0}
.pager>.btn.primary{flex:1.3 1 0}
.wl{white-space:nowrap}
@media (max-width:380px){.pager .lbl{display:none}}
.pager .seg{flex:0 1 auto}

/* ================= arrive & breathe ================= */
.arrive{min-height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:10px;padding:18px 16px}
.arrive h2{font-size:clamp(1.35rem,1.1rem + 1.2vw,1.8rem)}
.breath{position:relative;width:min(64vw,250px,42vh);aspect-ratio:1;margin:6px 0}
.breath .ring{position:absolute;inset:0;transform:rotate(-90deg);overflow:visible}
.ring .rbg{fill:none;stroke:rgba(255,255,255,.14);stroke-width:2.5}
.ring .rfg{fill:none;stroke:#fff;stroke-width:3;stroke-linecap:round;stroke-dasharray:100;stroke-dashoffset:100;transition:stroke-dashoffset linear;filter:drop-shadow(0 0 4px #fff)}
.breath .orb{position:absolute;inset:13%;border-radius:50%;transform:scale(.58);transition:transform 1.2s cubic-bezier(.45,0,.55,1);
  box-shadow:0 0 40px rgba(170,210,255,.5),0 0 110px rgba(246,163,203,.35)}
.orb i{position:absolute;inset:0;border-radius:50%}
.orb i:nth-child(1){background:radial-gradient(circle at 36% 30%,#fff 0,#E2F6FF 12%,#A6DCF5 34%,#9C90F2 66%,#D093E8 100%)}
.orb i:nth-child(2){background:conic-gradient(from 0deg,rgba(255,170,150,.6),rgba(130,235,190,.5),rgba(150,160,255,.6),rgba(255,200,120,.5),rgba(255,170,150,.6));mix-blend-mode:soft-light;animation:spin 16s linear infinite}
.orb i:nth-child(3){background:radial-gradient(circle at 30% 24%,rgba(255,255,255,.95),transparent 26%),radial-gradient(circle at 70% 78%,rgba(255,255,255,.25),transparent 30%)}
.breath:not([data-phase="idle"]) .orb{animation:orbGlow 3s ease-in-out infinite}
.breath[data-phase="in"] .orb,.breath[data-phase="hold"] .orb{transform:scale(1)}
@keyframes orbGlow{50%{box-shadow:0 0 60px rgba(170,210,255,.7),0 0 150px rgba(246,163,203,.5)}}
@keyframes spin{to{transform:rotate(360deg)}}
.parts{position:absolute;inset:0;animation:spin 50s linear infinite}
.parts i{position:absolute;left:50%;top:50%;width:6px;height:6px;margin:-3px;border-radius:50%;background:#fff;box-shadow:0 0 8px #fff,0 0 2px #fff;opacity:.75;transition:transform 1.2s cubic-bezier(.45,0,.55,1),opacity 1.2s}
.breath{container-type:inline-size}
.blabel{position:absolute;inset:0;display:grid;place-content:center;justify-items:center;text-align:center;color:#2A1530;pointer-events:none;line-height:1.1}
.blabel span{font-size:.95rem;font-size:6.2cqi;font-weight:800;max-width:44cqi}
.blabel b{font-size:2rem;font-size:14cqi;font-weight:800;line-height:1}
.breath[data-phase="idle"] .blabel span{font-size:.8rem;font-size:5.2cqi;max-width:32cqi;font-weight:700}
.arrive .hint{font-size:.85rem;color:var(--muted)}

/* ================= feelings grid ================= */
.slidehead{display:flex;align-items:center;gap:12px;padding:2px 4px 8px}
.chorb{width:34px;height:34px;border-radius:50%;flex:none;background:radial-gradient(circle at 35% 30%,#fff 0 7%,var(--c) 52%,transparent 72%);box-shadow:0 0 24px var(--c);animation:orbPulse 4s ease-in-out infinite}
@keyframes orbPulse{50%{transform:scale(1.12);box-shadow:0 0 34px var(--c)}}
.slidehead h2{font-size:1.35rem}
.slidehead h2 i{font-style:normal;font-weight:500;font-size:.9rem;color:var(--muted)}
.slidehead p{margin:0;font-size:.875rem;color:var(--muted);line-height:1.3}
.slidehead .linkbtn{margin-left:auto;flex:none}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(70px,1fr));gap:4px 2px}
.feel{position:relative;width:100%;border:0;background:transparent;border-radius:22px;padding:6px 2px 8px;min-height:92px;
  display:flex;flex-direction:column;align-items:center;justify-content:flex-start;gap:2px;transition:background .25s}
.feel:hover{background:var(--glass-2)}
.feel .halo{position:absolute;top:0;left:50%;width:70px;height:70px;margin-left:-35px;border-radius:50%;pointer-events:none;
  background:radial-gradient(circle,var(--c) 0%,color-mix(in srgb,var(--c) 40%,transparent) 35%,transparent 70%);opacity:0;transform:scale(.5);transition:opacity .4s,transform .5s var(--spring)}
.feel[aria-pressed="true"]{background:color-mix(in srgb,var(--c) 16%,transparent)}
.feel[aria-pressed="true"] .halo{opacity:.85;transform:scale(1.1)}
.feel .blob{width:56px;height:56px;position:relative;transition:transform .45s var(--spring)}
.feel[aria-pressed="true"] .blob{transform:scale(1.08)}
.fname{font-size:.8rem;font-weight:600;line-height:1.15;text-align:center;-webkit-hyphens:auto;hyphens:auto;overflow-wrap:break-word;max-width:100%;position:relative}
.feel[aria-pressed="true"] .fname{font-weight:800}
.motif{position:absolute;top:2px;right:4px;font-size:15px;line-height:1;animation:motif 4s ease-in-out infinite;animation-delay:var(--d,0s)}
@keyframes motif{50%{transform:translateY(-3px) rotate(8deg)}}
.tick{position:absolute;top:3px;left:5px;width:20px;height:20px;border-radius:50%;background:#fff;color:#2A1530;font-size:12px;font-weight:900;line-height:20px;text-align:center;transform:scale(0);transition:transform .35s var(--spring)}
.feel[aria-pressed="true"] .tick{transform:scale(1)}
.spark{position:absolute;left:50%;top:32px;width:6px;height:6px;margin:-3px;border-radius:50%;background:#fff;box-shadow:0 0 6px var(--c),0 0 12px var(--c);pointer-events:none;animation:spark .75s ease-out forwards}
@keyframes spark{to{transform:translate(var(--x),var(--y)) scale(.2);opacity:0}}

/* ================= blob character ================= */
.blob{display:block;overflow:visible}
.blob .rim{fill:none;stroke:rgba(255,255,255,.55);stroke-width:1.3}
.blob .face{fill:#2E2140}
.blob .ln{fill:none;stroke:#2E2140;stroke-width:3;stroke-linecap:round;stroke-linejoin:round}
.blob .bw{transform-box:fill-box;transform-origin:50% 100%;animation:idle 5s ease-in-out infinite;animation-delay:var(--d,0s)}
.blob .eyes{transform-box:fill-box;transform-origin:50% 50%;animation:blink 6s infinite;animation-delay:var(--bd,0s)}
@keyframes idle{50%{transform:scale(1.035,.975)}}
@keyframes blink{0%,93%,100%{transform:scaleY(1)}95%{transform:scaleY(.12)}}
.feel[aria-pressed="true"] .bw,.feel:hover .bw,.big .bw,.top-feel .bw,.step[aria-current="true"] .bw{animation-duration:var(--dur,2.4s);animation-name:var(--a,idle)}
.a-bob{--a:bob}.a-bounce{--a:bounce;--dur:1.2s}.a-shake{--a:shake;--dur:.6s}.a-tremble{--a:tremble;--dur:.35s}.a-droop{--a:droop;--dur:4s}
.a-float{--a:float;--dur:3.6s}.a-sway{--a:sway;--dur:3.2s}.a-pulse{--a:pulse;--dur:1.4s}.a-breathe{--a:breathe;--dur:5s}.a-tilt{--a:tilt;--dur:3s}.a-wobble{--a:wobble;--dur:1.1s}.a-pop{--a:pop;--dur:1.6s}
@keyframes bob{50%{transform:translateY(-4px)}}
@keyframes bounce{0%,100%{transform:translateY(0) scale(1)}15%{transform:scale(1.07,.9)}45%{transform:translateY(-9px) scale(.95,1.06)}70%{transform:translateY(0) scale(1.04,.96)}}
@keyframes shake{25%{transform:rotate(-5deg)}75%{transform:rotate(5deg)}}
@keyframes tremble{25%{transform:translateX(-1.2px)}75%{transform:translateX(1.2px)}}
@keyframes droop{50%{transform:translateY(2px) scale(1.03,.94)}}
@keyframes float{50%{transform:translateY(-7px) rotate(3deg)}}
@keyframes sway{25%{transform:rotate(-6deg)}75%{transform:rotate(6deg)}}
@keyframes pulse{50%{transform:scale(1.1)}}
@keyframes breathe{50%{transform:scale(1.07)}}
@keyframes tilt{40%,60%{transform:rotate(-10deg)}}
@keyframes wobble{25%{transform:rotate(-8deg) scale(1.03)}75%{transform:rotate(8deg) scale(.98)}}
@keyframes pop{0%,70%,100%{transform:scale(1)}80%{transform:scale(1.15)}}

/* ================= one feeling per slide ================= */
.fslide{background:radial-gradient(140% 70% at 0% 0%,color-mix(in srgb,var(--c) 34%,transparent),transparent 62%),var(--glass)}
.fhead{display:flex;align-items:center;gap:12px}
.fhtext{min-width:0;flex:1}
.fname2{display:flex;flex-wrap:wrap;align-items:baseline;gap:2px 8px}
.fhtext .strength{margin-top:6px;gap:4px}
.fhead .blob{width:76px;height:76px;flex:none;filter:drop-shadow(0 0 16px color-mix(in srgb,var(--c) 60%,transparent))}
.fhead h2{font-size:1.5rem}
.tag{display:inline-block;font-size:.8rem;border-radius:999px;padding:2px 10px;background:color-mix(in srgb,var(--c) 30%,transparent)}
.nudge{margin:6px 0 0;padding:6px 12px;font-size:.95rem;border-radius:var(--r-m);background:var(--glass-2);font-weight:600;line-height:1.4}
.fcols{display:grid;gap:0 22px}
.field{margin-top:6px}
.field>label,.field>.lab{display:block;font-weight:700;font-size:.875rem;margin-bottom:4px}
.hint{font-weight:400;color:var(--muted);font-size:.82rem}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chipb{border:0;background:var(--glass-2);color:var(--text);border-radius:999px;padding:.3rem .72rem;min-height:40px;font-size:.9rem;transition:transform .3s var(--spring),background .2s}
.chipb:active{transform:scale(.94)}
.chipb[aria-pressed="true"]{background:color-mix(in srgb,var(--c,var(--accent)) 48%,transparent);font-weight:800;box-shadow:inset 0 0 0 1.5px rgba(255,255,255,.55)}
.chipb[aria-pressed="true"]::before{content:"✓ "}
.strength{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.sdot{width:42px;height:42px;border-radius:50%;border:0;background:var(--glass-2);font-weight:800;font-size:.95rem;transition:transform .35s var(--spring),background .25s}
.sdot.on{background:color-mix(in srgb,var(--c) calc(var(--lv) * 13% + 22%),transparent)}
.sdot[aria-pressed="true"]{transform:scale(1.12);box-shadow:0 0 0 2px #fff,0 0 16px var(--c)}
.slabel{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
@media (min-width:720px){.slabel{position:static;width:auto;height:auto;clip:auto;font-size:.8rem;color:var(--muted);flex-basis:100%;line-height:1.2}}

/* ================= your day ================= */
.energy{display:grid;grid-template-columns:110px 1fr;gap:14px;align-items:center;margin-top:8px}
.figure{width:110px;height:165px;overflow:visible}
.figure .sil{fill:rgba(255,255,255,.08);stroke:rgba(255,255,255,.25);stroke-width:1.2}
.figure .glow{animation:glowp 3s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
@keyframes glowp{50%{transform:scale(1.35);opacity:.5}}
.elist{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:5px}
.elist li{display:flex;align-items:baseline;gap:8px;font-size:.9rem;line-height:1.3}
.elist .cd{width:11px;height:11px;border-radius:50%;background:var(--c);flex:none;position:relative;top:1px;box-shadow:0 0 8px var(--c)}
.elist .empty{opacity:.5}
.conn{border-radius:var(--r-m);padding:12px 14px;margin:10px 0;background:var(--glass-2);line-height:1.45}
.conn b{display:block;font-size:1rem;font-weight:800;margin-bottom:2px}
.closing{text-align:center;padding:22px 10px 8px;position:relative;overflow:hidden;border-radius:var(--r-m);margin-top:8px;background:var(--glass-2)}
.closing p{font-size:1.15rem;font-weight:700}
.bubble{position:absolute;bottom:-20px;width:14px;height:14px;border-radius:50%;opacity:.8;box-shadow:0 0 10px currentColor;animation:rise 3.4s ease-out forwards}
@keyframes rise{to{transform:translateY(-220px) translateX(var(--x));opacity:0}}

/* ================= look back ================= */
.seg{display:inline-flex;flex-wrap:wrap;gap:2px;padding:3px;border-radius:999px;background:var(--glass-2);-webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px)}
.seg button{border:0;background:transparent;border-radius:999px;padding:4px 12px;min-height:44px;font-size:.9rem}
.seg button[aria-pressed="true"]{background:rgba(255,255,255,.9);color:#2A1530;font-weight:800}
.stats{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin:12px 0}
.stat{background:var(--glass-2);border-radius:var(--r-m);padding:12px;text-align:center}
.stat b{display:block;font-size:1.7rem;font-weight:800}
.stat span{font-size:.85rem;color:var(--muted)}
.tops{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:8px;list-style:none;padding:0;margin:10px 0}
.top-feel{display:flex;align-items:center;gap:8px;background:color-mix(in srgb,var(--c) 22%,transparent);border-radius:var(--r-m);padding:6px 12px 6px 6px}
.top-feel .blob{width:42px;height:42px;flex:none}
.top-feel .nm{flex:1;min-width:0;overflow-wrap:break-word;-webkit-hyphens:auto;hyphens:auto;font-size:.92rem}
.top-feel .n{margin-left:auto;font-weight:800}
.bars{list-style:none;padding:0;margin:10px 0;display:flex;flex-direction:column;gap:10px}
.bars .lbl{display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap;font-size:.875rem}
.track2{height:14px;border-radius:999px;background:var(--glass-2);display:flex;overflow:hidden;margin-top:3px}
.track2 .o{background:var(--c);box-shadow:0 0 10px var(--c)}
.track2 .p{background:repeating-linear-gradient(45deg,var(--c) 0 5px,color-mix(in srgb,var(--c) 35%,transparent) 5px 10px)}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:.82rem;color:var(--muted)}
.legend i{display:inline-block;width:18px;height:10px;border-radius:4px;margin-right:4px;vertical-align:middle;background:var(--text)}
.legend i.p{background:repeating-linear-gradient(45deg,var(--text) 0 4px,transparent 4px 8px)}
.words{display:flex;flex-wrap:wrap;gap:6px;margin:10px 0}
.word{background:var(--glass-2);border-radius:999px;padding:3px 12px;font-weight:700}
.days{list-style:none;padding:0;margin:10px 0;display:flex;flex-direction:column;gap:6px}
.dayb{width:100%;text-align:left;border:0;background:var(--glass-2);border-radius:var(--r-m);padding:8px 12px;display:flex;align-items:center;gap:10px;flex-wrap:wrap;min-height:48px}
.dayb:hover{background:var(--glass-3)}
.dayb .d{font-weight:700;min-width:8.5rem}
.dayb .mini{display:flex;flex-wrap:wrap;gap:2px;align-items:center}
.dayb .mini .blob{width:26px;height:26px}
.sec-title{font-size:1.35rem;margin-bottom:4px}

/* ================= chakra guide ================= */
.chslide{background:radial-gradient(140% 70% at 0% 0%,color-mix(in srgb,var(--c) 32%,transparent),transparent 62%),var(--glass)}
.chgrid{display:grid;gap:4px 22px}
.chgrid dl{margin:0}
.chgrid dt{font-weight:700;font-size:.85rem;color:var(--muted);margin-top:10px}
.chgrid dd{margin:2px 0 0}
.feelmini{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}
.feelmini span{display:inline-flex;align-items:center;gap:4px;background:var(--glass-2);border-radius:999px;padding:2px 10px 2px 4px;font-size:.85rem}
.feelmini .blob{width:24px;height:24px}

/* ================= settings ================= */
.set{padding:16px;margin:0 0 12px}
.set h2{font-size:1.25rem;margin-bottom:8px}
.set ol{padding-left:1.3rem} .set li{margin:4px 0}
.skies{display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:8px;margin-top:6px}
.skysw{border:0;border-radius:var(--r-m);min-height:64px;padding:8px;display:flex;align-items:flex-end;font-size:.85rem;font-weight:700;text-shadow:0 1px 6px rgba(0,0,0,.7);box-shadow:inset 0 0 0 1px rgba(255,255,255,.15)}
.skysw[aria-pressed="true"]{box-shadow:inset 0 0 0 2px #fff,0 0 18px rgba(255,255,255,.35)}
.skysw[aria-pressed="true"]::after{content:" ✓"}
pre.code{max-height:240px;overflow:auto;background:var(--field);border-radius:var(--r-s);padding:12px;font-size:12px;line-height:1.4;white-space:pre-wrap;word-break:break-word}
.status{font-size:.9rem;margin-top:4px}
details.how summary{cursor:pointer;min-height:44px;display:flex;align-items:center;font-weight:700}

/* ================= tab bar ================= */
.tabbar{display:flex;justify-content:center;padding:4px 10px calc(8px + env(safe-area-inset-bottom))}
.tabs{display:flex;gap:2px;padding:4px;border-radius:999px}
.tab{border:0;background:transparent;border-radius:999px;padding:4px 12px;min-width:68px;min-height:52px;display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:.78rem;color:var(--muted);transition:background .25s}
.tab .ic{font-size:1.2rem;line-height:1.15}
.tab[aria-current="page"]{background:var(--glass-3);color:var(--text);font-weight:800}

.toast{position:fixed;left:50%;top:calc(10px + env(safe-area-inset-top));transform:translateX(-50%) translateY(-20px);opacity:0;z-index:30;
  background:rgba(255,255,255,.92);color:#2A1530;padding:8px 16px;border-radius:999px;font-size:.9rem;font-weight:600;transition:.3s var(--ease);pointer-events:none;max-width:calc(100% - 32px);text-align:center}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}


/* ================= today: steps, my day, body map, writing card ================= */
.stages{display:flex;gap:4px;justify-content:center;flex-wrap:wrap;padding:0 0 6px}
.stages button{border:0;background:var(--glass-2);border-radius:999px;padding:.3rem .95rem;min-height:42px;font-weight:800;font-size:.9rem;color:var(--muted);-webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px);transition:background .25s,color .25s}
.stages button[aria-current="step"]{background:rgba(255,255,255,.92);color:#2A1530}
.stages button:disabled{opacity:.4}
.stage{flex:1;min-height:0;display:flex;flex-direction:column;position:relative}
.dayhead{text-align:center;padding:2px 0 4px}
.dayhead h2{font-size:clamp(1.3rem,1.1rem + 1vw,1.7rem)}
.daygrid{display:grid;gap:12px}
@media (min-width:760px){.daygrid{grid-template-columns:minmax(0,1.05fr) minmax(0,1fr);align-items:start}}
.map{position:relative;width:min(100%,400px);aspect-ratio:360/440;margin:0 auto}
.mapsvg{position:absolute;inset:0;width:100%;height:100%;overflow:visible}
.fig circle,.fig path{fill:url(#figfill);stroke:rgba(255,255,255,.4);stroke-width:.55}
.spine{stroke:rgba(255,255,255,.3);stroke-width:1.5;stroke-dasharray:2 6;stroke-linecap:round}
.arc{fill:none;stroke-width:2.6;stroke-linecap:round;stroke-dasharray:5 9;animation:flow 2.6s linear infinite;opacity:.9}
@keyframes flow{to{stroke-dashoffset:-28}}
.ringo{fill:none;stroke-width:3.2;stroke-linecap:round}
.mapsvg .glow{animation:glowp 3.4s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
.maporb{position:absolute;transform:translate(-50%,-50%);aspect-ratio:1;min-width:44px;border-radius:50%;border:0;background:transparent;min-height:0;padding:0}
.mapfeel{position:absolute;transform:translate(-50%,-50%);width:44px;height:44px;border:0;background:transparent;padding:0;border-radius:50%;transition:transform .35s var(--spring)}
.mapfeel:hover{transform:translate(-50%,-50%) scale(1.15)}
.mapfeel .blob{width:100%;height:100%;filter:drop-shadow(0 0 7px color-mix(in srgb,var(--c) 75%,transparent))}
.mapfeel.stay::before{content:"";position:absolute;inset:-14px;border-radius:50%;background:radial-gradient(circle,color-mix(in srgb,var(--c) 60%,transparent),transparent 70%);animation:glowp 4s ease-in-out infinite}
.mapfeel.push .blob{opacity:.5;filter:grayscale(.5)}
.pen,.more{position:absolute;border-radius:999px;background:#fff;color:#2A1530;font-weight:900;line-height:18px;min-width:18px;height:18px;font-size:12px;text-align:center;padding:0 4px}
.pen{right:-6px;top:-6px}
.more{right:-8px;bottom:-6px}
.legend2{text-align:center;font-size:.8rem;color:var(--muted);margin:2px 0 0;line-height:1.6}
.lg{display:inline-block;width:16px;height:4px;border-radius:2px;vertical-align:middle;margin:0 3px 0 6px;background:var(--text)}
.lg.dots{background:radial-gradient(circle,var(--text) 1.4px,transparent 1.7px) 0 50%/5.5px 4px repeat-x}
.sidecol{padding:14px 16px}
.chlist{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:10px}
.chrow{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:4px}
.chrow .cd{width:12px;height:12px;border-radius:50%;background:var(--c);box-shadow:0 0 10px var(--c);flex:none}
.fchip{--c:inherit}
.h3{font-size:1.1rem;margin-top:16px}
.sheet{position:absolute;inset:0;z-index:5;display:flex;flex-direction:column;border-radius:var(--r-l);background:rgba(14,8,30,.4);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);animation:sheetUp .45s var(--glide) both}
@keyframes sheetUp{from{opacity:0;transform:translateY(36px)}}
.linkp{margin-top:6px;background:var(--glass-2);border-radius:var(--r-m);padding:0 12px}
.linkp summary{min-height:38px;display:flex;align-items:center;cursor:pointer;font-weight:800;font-size:.9rem}
.linkp p{margin:0 0 10px;font-size:.92rem}
.takeaway{display:flex;gap:12px;align-items:flex-start;text-align:left;margin:12px auto 4px;max-width:30rem;padding:12px 14px;border-radius:var(--r-m);background:color-mix(in srgb,var(--c) 26%,transparent)}
.takeaway p{margin:2px 0 0;font-size:.95rem;font-weight:500}
.takeaway{position:relative;z-index:1;-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px)}

/* ================= the garden and its panels ================= */
.viewcol{position:relative;min-width:0}
.viewsw{position:absolute;top:8px;right:8px;z-index:3;display:flex;margin:0}
.viewsw .seg{background:var(--glass);flex-wrap:nowrap}
.viewsw .seg button{min-height:40px;padding:4px 10px;font-size:.85rem}
.viewsw.inline{position:static;justify-content:center;margin:0 0 8px}
.gcap{color:var(--text);font-size:.88rem;opacity:.92}
.phone-only{display:none}
@media (max-width:759px){.phone-only{display:inline}}
.ghint{position:absolute;left:50%;top:56px;transform:translateX(-50%);width:min(320px,calc(100% - 24px));padding:10px 12px;display:flex;flex-direction:column;gap:8px;font-size:.92rem;line-height:1.35;z-index:2;animation:popIn .3s var(--spring) both}
.ghint .btn{align-self:flex-end;min-height:40px}
.chdot{display:inline-block;width:.7em;height:.7em;border-radius:50%;background:var(--c);margin:0 .25em 0 .15em;box-shadow:0 0 6px var(--c)}
.steplabel{flex-basis:100%;text-align:center;margin:2px 0 0;font-size:.9rem;font-weight:700;color:var(--muted)}
@media (min-width:760px){.daygrid.gardengrid{grid-template-columns:minmax(0,1.6fr) minmax(0,1fr)}}
.gwrap{position:relative;width:100%;aspect-ratio:16/9;max-height:min(470px,82vh);border-radius:var(--r-l);overflow:hidden;box-shadow:0 12px 40px rgba(5,2,15,.35),inset 0 0 0 1px rgba(255,255,255,.12)}
.gwrap canvas{display:block;width:100%;height:100%;cursor:pointer}
.gwrap canvas{touch-action:pan-y pinch-zoom}
@media (max-width:759px){.gwrap{aspect-ratio:4/3}}
.gpan{position:absolute;bottom:8px;width:40px;height:40px;border-radius:50%;display:grid;place-items:center;font-size:1.3rem;line-height:1;color:var(--text);z-index:1;opacity:.8;border:1px solid var(--line)}
.gpan[hidden]{display:none}
.gpan:disabled{opacity:.3}
.gpan.l{left:8px}.gpan.r{right:8px}
.gbubble{position:absolute;width:240px;max-width:calc(100% - 16px);padding:10px 12px;display:flex;flex-direction:column;gap:2px;font-size:.9rem;line-height:1.35;animation:popIn .3s var(--spring) both;z-index:2}
.gbubble[hidden]{display:none}
.gbubble .linkbtn{align-self:flex-start;padding:0;min-height:36px}
.glist{list-style:none;margin:6px 0 0;padding:0;display:flex;flex-direction:column;gap:6px}
.glist li{display:flex;gap:10px;align-items:baseline;line-height:1.35}
.glist .gi{width:1.4em;text-align:center;flex:none}
.linkbtn.gl{padding:0 2px;min-height:40px;font-weight:800;font-size:1rem;opacity:1}
.glist li:has(.gl){align-items:center}
.wgroup{margin-top:14px;padding:10px 12px;border-radius:var(--r-m);background:linear-gradient(90deg,color-mix(in srgb,var(--c) 22%,transparent),transparent)}
.wgroup h3{font-size:1rem;margin-bottom:6px}
.wbtn{display:block;width:100%;text-align:left;border:0;background:var(--glass-2);color:var(--text);border-radius:16px;padding:.55rem .8rem;margin:5px 0;min-height:44px;font-size:.95rem;line-height:1.35;transition:background .2s,transform .3s var(--spring)}
.wbtn:active{transform:scale(.98)}
.wbtn[aria-pressed="true"]{background:color-mix(in srgb,var(--c) 45%,transparent);box-shadow:inset 0 0 0 1.5px rgba(255,255,255,.6);font-weight:700}
.wbtn[aria-pressed="true"]::before{content:"🏮 "}
.wmine{display:flex;gap:6px;align-items:center}
.wmine .wbtn{flex:1}
.wdel{width:40px;height:40px;font-size:.9rem}
.bodyq{margin:8px 0 0;font-weight:800;font-size:1.05rem}
.bodyq.pulse{animation:pickPop .8s var(--spring)}
.mixnote{margin:0 0 2px;text-align:center;font-size:.85rem;color:var(--muted)}
@media (orientation:landscape) and (max-height:520px){.mixnote{display:none}}
/* the stay / pushed away / unsure pop-up */
.ask{position:fixed;inset:0;z-index:40;-webkit-backdrop-filter:blur(3px);backdrop-filter:blur(3px);display:grid;place-items:center;padding:16px;background:rgba(10,6,24,.45);animation:fadeIn .25s ease both}
@keyframes fadeIn{from{opacity:0}}
.askbox{width:min(100%,360px);padding:18px 18px 14px;text-align:center;background:radial-gradient(130% 70% at 50% 0%,color-mix(in srgb,var(--c) 38%,transparent),transparent 65%),rgba(30,20,56,.82);animation:popIn .4s var(--spring) both}
@keyframes popIn{from{opacity:0;transform:scale(.85) translateY(12px)}}
.askbox .blob{width:72px;height:72px;margin:0 auto 4px;filter:drop-shadow(0 0 16px color-mix(in srgb,var(--c) 70%,transparent))}
.askbox h2{font-size:1.25rem}
.askbox p{margin:4px 0 12px;color:var(--muted);font-size:.92rem}
.askopts{display:grid;gap:8px}
.askopts .btn{width:100%;flex-direction:column;align-items:flex-start;gap:0;padding:.5rem 18px;font-size:1rem;border-radius:20px;line-height:1.25}
.askopts .btn[aria-pressed="true"]{box-shadow:inset 0 0 0 2px #fff}
.askopts .btn small{font-weight:500;color:var(--muted);font-size:.82rem;text-align:left}
.askskip{margin-top:6px;min-height:46px;padding:0 14px}
#neb,#stars{transition:opacity 1.2s}
body.hush #neb{opacity:.5} body.hush #stars{opacity:.3}
@media (orientation:landscape) and (max-height:520px){
  .stages{position:absolute;top:-46px;left:50%;transform:translateX(-50%);padding:0;flex-wrap:nowrap;z-index:2} .stages button{min-height:40px;min-width:44px;padding:.2rem .7rem;white-space:nowrap}
  .stages .sl{display:none}
  .fhead .blob{width:52px;height:52px}
  .map{width:min(100%,300px)}
  .askbox{width:min(100%,620px);padding:12px 14px 8px}
  .askbox .blob{display:none}
  .askbox p{margin:2px 0 8px}
  .askopts{grid-template-columns:repeat(3,1fr)}
  .askopts .btn{align-items:center;padding:.4rem 10px}
  .askopts .btn small{display:none}
}
@media (min-width:720px){
  .fcols,.chgrid{grid-template-columns:1fr 1fr}
  .stats{grid-template-columns:repeat(4,1fr)}
  .grid{grid-template-columns:repeat(auto-fill,minmax(92px,1fr))}
  .feel .blob{width:62px;height:62px}
}
@media (max-width:420px){
  .fhead .blob{width:64px;height:64px}
  .sdot{width:40px;height:40px}
  #syncText{display:none}
  .chip-sync{width:auto;padding:0 10px;gap:4px}
  .chip-sync .cloud{display:inline}
  .tab{min-width:62px;padding:4px 8px}
  .energy{grid-template-columns:84px 1fr;gap:10px}
  .figure{width:84px;height:126px}
  .tdate .d{min-width:7.2rem}
  .pager .btn{padding:.5rem .7rem}
}
/* phone held sideways: tabs become a rail on the left */
@media (orientation:landscape) and (max-height:520px){
  body{grid-template-columns:auto minmax(0,1fr);grid-template-rows:auto minmax(0,1fr)}
  .top{grid-column:2;padding:4px 16px 2px}
  main{grid-column:2;grid-row:2}
  .tabbar{grid-column:1;grid-row:1 / span 2;align-items:center;padding:6px 0 calc(6px + env(safe-area-inset-bottom)) max(8px,env(safe-area-inset-left))}
  .tabs{flex-direction:column;border-radius:28px}
  .tab{min-width:64px;min-height:46px;padding:2px 6px;font-size:.75rem}
  .stepper{padding:0 0 4px}
  .slidehead{padding:0 4px 4px}
  .slidehead p,.greet{display:none}
  .chorb{width:24px;height:24px}
  .slidehead h2{font-size:1.15rem}
  .step{height:42px}
  .pager{padding:6px 0 8px}
  .pager .btn{min-height:44px}
  .fcols,.chgrid{grid-template-columns:1fr 1fr}
  .arrive{flex-direction:row;flex-wrap:wrap;gap:6px 24px;padding:10px}
  .breath{width:min(40vh,170px)}
  .grid{grid-template-columns:repeat(auto-fill,minmax(80px,1fr))}
  .feel{min-height:84px}
  .feel .blob{width:48px;height:48px}
}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<canvas id="neb" aria-hidden="true"></canvas>
<canvas id="stars" aria-hidden="true"></canvas>
<div class="veil" aria-hidden="true"></div>
<svg width="0" height="0" style="position:absolute" aria-hidden="true" focusable="false"><defs id="defs"></defs></svg>

<header class="top">
  <div class="topl" id="topLeft"></div>
  <div class="topr">
    <button class="round" id="soundBtn" data-act="sound" aria-label="Sounds" aria-pressed="true">🔔</button>
    <button class="chip-sync" id="syncChip" data-act="syncNow" data-s="local"><span class="cloud" aria-hidden="true">☁️</span><span class="dot" aria-hidden="true"></span><span id="syncText">Saved on this device</span></button>
  </div>
</header>
<main>
  <section class="screen" id="today" aria-label="Today"></section>
  <section class="screen" id="look" aria-label="Look back" hidden></section>
  <section class="screen" id="chakras" aria-label="Chakras" hidden></section>
  <section class="screen" id="settings" aria-label="Settings" hidden></section>
</main>
<nav class="tabbar" aria-label="Sections"><div class="tabs glass" id="tabs"></div></nav>
<div class="toast" id="toast" role="status" aria-live="polite"></div>
<input type="file" id="restoreFile" accept="application/json,.json" hidden>

<script>
/* ================= CONTENT (edit here) ================= */

// The seven chakras, from the base of the spine to the top of the head.
// c / light / deep: the colours used for this chakra's characters.
// open / guarded: what it is like when this centre is open, and when it protects itself.
// qOpen / qGuarded: the reflection question shown on a feeling's slide.
const CHAKRAS = [
  { id:'root', n:1, name:'Root', short:'Root', skt:'Muladhara', c:'#F2837F', light:'#FFCDC8', deep:'#C9545A', note:261.63,
    place:'Base of the spine, legs and feet',
    theme:'Safety, the body, belonging, having enough', right:'The right to be here and to have what you need',
    open:'You feel held by the ground: safe enough to rest, and safe enough to reach out.',
    guarded:'The body is on watch. Everything can look like a threat, and there is no room to rest or to play.',
    closedBy:'Fear',
    qOpen:'What made you feel safe today? Could you find it again tomorrow?',
    qGuarded:'Was the threat really in the room, or in a story about what might happen?',
    practice:'Put both feet flat on the floor and press them down for three slow breaths. Then name five things you can see.' },
  { id:'sacral', n:2, name:'Sacral', short:'Sacral', skt:'Svadhisthana', c:'#F7A35C', light:'#FFD9B3', deep:'#D9742E', note:293.66,
    place:'Lower belly and hips',
    theme:'Pleasure, play, creativity, letting feelings move', right:'The right to feel and to enjoy',
    open:'Feelings move through you like water, and you can enjoy things without earning them first.',
    guarded:'Pleasure becomes something for "later", once the work is done. Feelings are kept still so they cannot spill.',
    closedBy:'Guilt',
    qOpen:'What gave you pleasure today, just for itself?',
    qGuarded:'What would you enjoy if nobody were watching or judging, including you?',
    practice:'Move your hips gently, or do one small thing only because it feels nice: warm tea, a song, a stretch.' },
  { id:'solar', n:3, name:'Solar plexus', short:'Solar', skt:'Manipura', c:'#F2C744', light:'#FFEBA8', deep:'#CF9A17', note:329.63,
    place:'Stomach, just below the ribs',
    theme:'Will, self-worth, your own power', right:'The right to act and to be yourself',
    open:'You act from your own value, not from the need to prove it.',
    guarded:'Your energy goes into defending yourself: judging, controlling, bracing for criticism.',
    closedBy:'Shame',
    qOpen:'Where did you act from your own strength today?',
    qGuarded:'Whose judgement were you bracing against? Is it theirs, or a voice you carry inside?',
    practice:'Put a hand on your stomach, breathe into it and say quietly: "I am allowed to take up space."' },
  { id:'heart', n:4, name:'Heart', short:'Heart', skt:'Anahata', c:'#7FD39A', light:'#CDF5D8', deep:'#3F9E63', note:392.00,
    place:'Chest, arms and hands',
    theme:'Love, connection, compassion, grief', right:'The right to love and to be loved',
    open:'You can let others in, and let yourself be moved by them.',
    guarded:'Walls go up to keep hurt out, and they keep warmth out too.',
    closedBy:'Grief',
    qOpen:'Who or what opened your heart today? Do they know?',
    qGuarded:'What hurt is this wall protecting? What would one small window look like?',
    practice:'Send one warm message to someone, for no reason. Or rest a hand on your chest and breathe there.' },
  { id:'throat', n:5, name:'Throat', short:'Throat', skt:'Vishuddha', c:'#6EC3F0', light:'#C6EAFC', deep:'#348CC4', note:440.00,
    place:'Throat, neck and jaw',
    theme:'Expression, truth, being heard', right:'The right to speak and to be heard',
    open:'What you feel and what you say match.',
    guarded:'Words are checked and filtered before they leave; the jaw holds on to what was not said.',
    closedBy:'Untruth, to others or to yourself',
    qOpen:'What did you say today that was really true?',
    qGuarded:'What did you not say today? Who would you like to say it to?',
    practice:'Hum for three long breaths, or write the unsaid sentence down without sending it.' },
  { id:'third', n:6, name:'Third eye', short:'Third eye', skt:'Ajna', c:'#8F95F0', light:'#D3D5FF', deep:'#5A60C9', note:523.25,
    place:'Forehead, between the eyebrows',
    theme:'Insight, intuition, how you see things', right:'The right to see clearly',
    open:'You see clearly and trust what you notice.',
    guarded:'Thinking spins in circles: analysing and judging to stay in control, without really seeing more.',
    closedBy:'Illusion',
    qOpen:'What did you notice or understand today?',
    qGuarded:'Was your mind seeing the situation, or building a wall of explanations around it?',
    practice:'Close your eyes and rest your attention between your eyebrows. Notice one thought, call it "thinking", and let it pass.' },
  { id:'crown', n:7, name:'Crown', short:'Crown', skt:'Sahasrara', c:'#C59AF0', light:'#ECDCFF', deep:'#9263CF', note:587.33,
    place:'Top of the head',
    theme:'Meaning, peace, being part of something bigger', right:'The right to know and to belong to something larger',
    open:'You feel part of something larger than your own worries.',
    guarded:'Life shrinks to a list of tasks, and meaning gets lost underneath it.',
    closedBy:'Attachment',
    qOpen:'What felt meaningful, or bigger than you, today?',
    qGuarded:'What are you holding on to so tightly that it is hard to rest?',
    practice:'Look at the sky for one minute and let your worries be small for a moment.' },
];

// The feelings, grouped by chakra (open ones first). Columns:
// id, name, chakra id, tone (open | prot = protective | neutral), eyes, mouth, motif emoji, animation, blush (1 = yes)
// eyes:  dot wide happy closed down sad angry worried side brave
// mouth: smile grin frown o flat wavy tiny tongue smirk zip
// animation: bob bounce shake tremble droop float sway pulse breathe tilt wobble pop
const FEELINGS = [
  ['safe','Safe','root','open','closed','smile','🏡','breathe',1],
  ['grounded','Grounded','root','open','closed','smile','🌳','breathe',0],
  ['relaxed','Relaxed','root','open','closed','smile','🏖️','sway',1],
  ['content','Content','root','open','closed','smile','🍵','breathe',1],
  ['sleepy','Sleepy','root','neutral','closed','flat','💤','breathe',0],

let P = { url:'', key:'', sky:'drift', sound:true, lastSync:0, view:'garden', sheetV:1, gardenHint:0 };
const UI = { tab:'today', date:todayKey(), step:null, idx:{ choose:0, card:0, look:0, chakras:0 }, open:null, panel:null, view:'garden', wGroup:'safe', range:7,
  sync:'local', syncMsg:'', pendingRefresh:false, lastSeenDay:todayKey() };

/* ================= logic ================= */
function todayKey(){ return dkey(new Date()); }
function dkey(d){ return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`; }
function parseKey(k){ const [y,m,d] = k.split('-').map(Number); return new Date(y, m-1, d); }
function addDays(k, n){ const d = parseKey(k); d.setDate(d.getDate()+n); return dkey(d); }
function niceDate(k, opts){ return parseKey(k).toLocaleDateString('en-GB', opts || { weekday:'long', day:'numeric', month:'long' }); }
function str(v, max){ return typeof v === 'string' ? v.slice(0, max) : ''; }

function blankItem(){ return { strength:0, when:[], whenNote:'', why:'', thoughts:'', stay:'' }; }
function cleanItem(it){
  it = it && typeof it === 'object' ? it : {};
  const s = Math.round(+it.strength);
  return { strength: s>=1 && s<=5 ? s : 0,
    when: Array.isArray(it.when) ? it.when.filter((w,i,a) => WHEN.includes(w) && a.indexOf(w) === i) : [],
    whenNote: str(it.whenNote, 300), why: str(it.why, 4000), thoughts: str(it.thoughts, 4000),
    stay: ['stay','push','unsure'].includes(it.stay) ? it.stay : '' };
}
function cleanDays(raw){
  const out = {};
  if (!raw || typeof raw !== 'object') return out;
  for (const [date, d] of Object.entries(raw)){
    if (!/^\d{4}-\d{2}-\d{2}$/.test(date) || !d || typeof d !== 'object' || !Array.isArray(d.order)) continue;
    const src = d.items && typeof d.items === 'object' ? d.items : {};
    const items = {};
    for (const [id, it] of Object.entries(src)) if (F[id]) items[id] = cleanItem(it);
    const order = d.order.filter((id,i,a) => F[id] && a.indexOf(id) === i);
    order.forEach(id => { if (!items[id]) items[id] = blankItem(); });
    out[date] = { updated:+d.updated || 0, synced:!!d.synced, order, items, env:cleanEnv(d.env), words:cleanWords(d.words) };
  }
  return out;
}

function cleanEnv(e){
  const out = blankEnv(); if (!e || typeof e !== 'object') return out;
  ENV_GROUPS.forEach(gr => { out[gr.id] = Array.isArray(e[gr.id]) ? e[gr.id].filter((o,i,a) => gr.opts.includes(o) && a.indexOf(o) === i) : []; });
  out.note = str(e.note, 2000); return out;
}
function cleanWords(a){ return Array.isArray(a) ? a.filter((t,i,arr) => typeof t === 'string' && t.trim() && arr.indexOf(t) === i).map(t => t.slice(0, 300)).slice(0, 12) : []; }
function cleanCustom(a){ return Array.isArray(a) ? a.filter(c => c && WORDS.some(gr => gr.id === c.g) && typeof c.t === 'string' && c.t.trim()).map(c => ({ g:c.g, t:c.t.slice(0, 200) })).slice(0, 60) : []; }
function envEmpty(e){ return !e || (!e.note && ENV_GROUPS.every(gr => !e[gr.id].length)); }
function getDay(date, create){
  if (!S.days[date] && create) S.days[date] = { updated:0, synced:false, order:[], items:{}, env:blankEnv(), words:[] };
  if (S.days[date] && !S.days[date].env) S.days[date].env = blankEnv();
  if (S.days[date] && !S.days[date].words) S.days[date].words = [];
  return S.days[date];
}
function touch(date){
  const d = getDay(date, true);
  d.updated = Date.now();
  S.dirty[date] = 1;
  save(); scheduleSync();
}
function togglePick(id){
  const d = getDay(UI.date, true);
  const at = d.order.indexOf(id);
  if (at >= 0) d.order.splice(at, 1);
  else { d.order.push(id); if (!d.items[id]) d.items[id] = blankItem(); }
  touch(UI.date);
  return at < 0;
}
function itemsOf(date){
  const d = S.days[date]; if (!d) return [];
  return d.order.map(id => ({ id, date, ...d.items[id] }));
}
function datesInRange(range){
  const all = Object.keys(S.days).filter(k => S.days[k].order.length).sort();
  if (range === 'all') return all;
  const from = addDays(todayKey(), -(range-1));
  return all.filter(k => k >= from);
}
function chosenIn(ch){ const d = S.days[UI.date]; return d ? d.order.filter(id => F[id].ch === ch).length : 0; }

// How much each chakra was active: n feelings, open/protective counts, score (sum of strengths, 3 if not set)
function tally(items){
  const t = {}; CHAKRAS.forEach(c => t[c.id] = { n:0, open:0, prot:0, score:0, names:[] });
  items.forEach(it => { const f = F[it.id], x = t[f.ch];
    x.n++; x.score += it.strength || 3;
    if (f.tone === 'prot') x.prot++; else x.open++;
    if (!x.names.includes(f.name)) x.names.push(f.name); });
  return t;
}
function connections(items, isDay){
  if (!items.length) return [];
  const t = tally(items), out = [];
  const prot = items.filter(it => F[it.id].tone === 'prot').length;
  const lower = ['root','sacral','solar'].some(c => t[c].n), upper = ['throat','third','crown'].some(c => t[c].n);
  if (prot === items.length && items.length >= 2) out.push(SPECIAL.allProt);
  else if (items.length >= 3 && prot / items.length <= .2) out.push(SPECIAL.mostlyOpen);
  if (upper && !lower && !t.heart.n) out.push(SPECIAL.headOnly);
  const pushed = items.filter(it => it.stay === 'push');
  if (isDay && pushed.length >= 2) out.push({ title:SPECIAL.pushed.title,
    text:SPECIAL.pushed.text.replace('{n}', pushed.length).replace('{list}', pushed.map(it => F[it.id].name.toLowerCase()).join(', ')) });
  CONNECTIONS.filter(c => t[c.pair[0]].n && t[c.pair[1]].n)
    .map(c => ({ ...c, w: t[c.pair[0]].score + t[c.pair[1]].score }))
    .sort((a,b) => b.w - a.w).slice(0, Math.max(1, 3 - out.length))
    .forEach(c => out.push(c));
  return out.slice(0, 3);
}
function topWords(items){
  const count = {};
  items.forEach(it => ((it.why || '') + ' ' + (it.thoughts || '') + ' ' + (it.whenNote || '')).toLowerCase()
    .match(/[a-zà-ÿ']+/g)?.forEach(w => { w = w.replace(/^'+|'+$/g,''); if (w.length > 2 && !STOP_WORDS.includes(w)) count[w] = (count[w]||0) + 1; }));
  return Object.entries(count).filter(([,n]) => n >= 2).sort((a,b) => b[1]-a[1]).slice(0, 16);
}

/* ================= spreadsheet rows ================= */
const HEAD = ['Date','Feeling','Chakra','Open or protective','Strength (1-5)','When','Why','Thoughts','Let it stay?','Entry ID','Updated','Around me','What I told myself','Words to hold'];
function envText(e){ return e ? ENV_GROUPS.filter(gr => e[gr.id].length).map(gr => gr.short + ': ' + e[gr.id].join(', ')).join(' · ') : ''; }
function parseEnv(s, note){ const e = blankEnv(); String(s ?? '').split(' · ').forEach(part => { const i = part.indexOf(': '); if (i < 0) return; const gr = ENV_GROUPS.find(x => x.short === part.slice(0, i)); if (gr) e[gr.id] = part.slice(i + 2).split(', ').filter(o => gr.opts.includes(o)); }); e.note = str(String(note ?? ''), 2000); return e; }
function whenText(it){ return it.when.join(', ') + (it.whenNote ? (it.when.length ? ' – ' : '') + it.whenNote : ''); }
function parseWhen(s){
  s = String(s ?? ''); const i = s.indexOf(' – ');
  const head = i >= 0 ? s.slice(0, i) : s; const parts = head.split(', ').filter(Boolean);
  if (parts.length && parts.every(p => WHEN.includes(p))) return { when:parts, whenNote: i >= 0 ? s.slice(i+3) : '' };
  return { when:[], whenNote:s };
}
function rowsFor(date){
  const d = S.days[date]; if (!d) return [];
  const ex = [envText(d.env), d.env?.note || '', (d.words || []).join(' | ')];
  const rows = d.order.map(id => { const f = F[id], it = d.items[id];
    return [date, f.name, CH[f.ch].name, TONE_LABEL[f.tone], it.strength || '', whenText(it), it.why, it.thoughts, STAY_SHEET[it.stay] || '', date + '_' + id, d.updated, ...ex]; });
  if (!rows.length && (!envEmpty(d.env) || (d.words || []).length)) rows.push([date, '', '', '', '', '', '', '', '', date + '_day', d.updated, ...ex]);
  return rows;
}
function daysFromRows(rows){
  const days = {};
  (Array.isArray(rows) ? rows : []).forEach(r => {
    if (!Array.isArray(r)) return;
    const date = String(r[0]).slice(0, 10); if (!/^\d{4}-\d{2}-\d{2}$/.test(date)) return;
    const eid = String(r[9] ?? ''); let id = eid.startsWith(date + '_') ? eid.slice(11) : '';
    const d = days[date] || (days[date] = { updated:0, synced:true, order:[], items:{}, env:blankEnv(), words:[] });
    d.updated = Math.max(d.updated, +r[10] || 0);
    if (r.length > 11 && (r[11] || r[12] || r[13])){ d.env = parseEnv(r[11], r[12]); d.words = cleanWords(String(r[13] ?? '').split(' | ')); }
    if (!F[id]) id = BY_NAME[String(r[1]).toLowerCase()]; if (!F[id]) return;
    if (d.order.includes(id)) return;
    const stay = Object.keys(STAY_SHEET).find(k => STAY_SHEET[k] === r[8]) || '';
    d.order.push(id);
    d.items[id] = cleanItem({ strength:r[4], ...parseWhen(r[5]), why:String(r[6] ?? ''), thoughts:String(r[7] ?? ''), stay });
  });
  return days;
}

/* ================= saving ================= */
const store = {
  load(k){ try { return JSON.parse(localStorage.getItem(k)); } catch(e){ return null; } },
  save(k, v){ try { localStorage.setItem(k, JSON.stringify(v)); return true; } catch(e){ return false; } },
  clear(k){ try { localStorage.removeItem(k); } catch(e){} },
};
let saveT;
function save(){ clearTimeout(saveT); saveT = setTimeout(saveNow, 200); }
function saveNow(){ clearTimeout(saveT); store.save(KEY, { v:1, savedAt:Date.now(), days:S.days, dirty:S.dirty, custom:S.custom }); }
function savePrefs(){ store.save(PKEY, P); }
function loadAll(){
  const s = store.load(KEY);
  if (s && s.v === 1){ S.days = cleanDays(s.days); S.custom = cleanCustom(s.custom); S.dirty = s.dirty && typeof s.dirty === 'object' ? Object.fromEntries(Object.keys(s.dirty).filter(k => /^\d{4}-\d{2}-\d{2}$/.test(k)).map(k => [k,1])) : {}; }
  const p = store.load(PKEY);
  if (p && typeof p === 'object') P = { url:validUrl(str(p.url,500)) ? str(p.url,500) : '', key:str(p.key,200),
    sky: p.sky === 'drift' || SKIES.some(s => s.id === p.sky) ? p.sky : 'drift',
    sound: p.sound !== false, lastSync:+p.lastSync || 0, view: p.view === 'body' ? 'body' : 'garden', sheetV: p.sheetV === 2 ? 2 : 1, gardenHint: p.gardenHint === 1 ? 1 : 0 };
  UI.view = P.view;
}

/* ================= Google Sheet sync ================= */
let syncing = false, again = false, syncT, loud = false;
function validUrl(u){ return /^https:\/\/script\.google(usercontent)?\.com\/\S+$/.test(u); }
function scheduleSync(){ clearTimeout(syncT); if (P.url) syncT = setTimeout(sync, 6000); else setSync('local'); }
async function sync(manual){
  clearTimeout(syncT);
  if (manual) loud = true;
  if (!P.url) { setSync('local'); return; }
  if (!navigator.onLine) { setSync('offline'); return; }
  if (syncing) { again = true; return; }
  syncing = true; setSync('syncing');
  const dates = Object.keys(S.dirty);
  const sent = {}; dates.forEach(d => sent[d] = S.days[d]?.updated || 0);
  try {
    const r = await fetch(P.url, { method:'POST', body:JSON.stringify({ action:'sync', key:P.key, days:dates.map(d => ({ date:d, rows:rowsFor(d).filter(r => P.sheetV >= 2 || r[1]).map(r => P.sheetV >= 2 ? r : r.slice(0, 11)) })) }) });
    const text = await r.text(); let j;
    try { j = JSON.parse(text); } catch(e) { throw new Error(/<html|<!doctype/i.test(text) ? 'Google answered with a sign-in page. In the deployment, set "Who has access" to "Anyone".' : 'The sheet gave an unexpected answer.'); }
    if (!j || !j.ok) throw new Error(j && j.error ? String(j.error) : 'No answer');
    dates.forEach(d => { if ((S.days[d]?.updated || 0) === sent[d]) { delete S.dirty[d]; if (S.days[d]) S.days[d].synced = true; } });
    if (j.v >= 2 && P.sheetV < 2){ P.sheetV = 2; Object.keys(S.days).forEach(d => { const x = S.days[d]; if (!envEmpty(x.env) || (x.words || []).length) S.dirty[d] = 1; }); again = true; }
    const changed = mergeRemote(daysFromRows(j.rows), j.v >= 2);
    P.lastSync = Date.now(); savePrefs(); saveNow(); setSync('ok');
    if (loud) Sound.play('sync');
    if (changed.length) refreshAfterSync(changed);
  } catch(e){
    setSync('error', e && e.message ? e.message : 'Could not reach the sheet');
    if (loud) Sound.play('error');
  } finally {
    syncing = false; loud = false;
    if (again) { again = false; sync(); }
  }
}
function mergeRemote(remote, full){
  const changed = [];
  for (const [date, rd] of Object.entries(remote)){
    if (S.dirty[date]) continue;
    const ld = S.days[date];
    if (!ld || rd.updated > ld.updated || (!ld.synced && JSON.stringify(ld.order) !== JSON.stringify(rd.order))) { if (!full && ld){ rd.env = ld.env; rd.words = ld.words; } S.days[date] = rd; changed.push(date); }
    else ld.synced = true;
  }
  for (const [date, ld] of Object.entries(S.days))
    if (!remote[date] && !S.dirty[date] && ld.synced && (ld.order.length || (full && (!envEmpty(ld.env) || ld.words.length)))) { delete S.days[date]; changed.push(date); }
  return changed;
}
function typing(){ const a = document.activeElement; return a && /^(TEXTAREA|INPUT)$/.test(a.tagName); }
function refreshAfterSync(changed){
  if (UI.tab === 'today' && !changed.includes(UI.date)) return;
  if (typing()) { UI.pendingRefresh = true; return; }   // redraw once the box is left
  render();
}
function setSync(s, msg){
  UI.sync = s; UI.syncMsg = msg || '';
  const chip = $('syncChip'), t = $('syncText');
  chip.dataset.s = s;
  const label = ({ local:'Saved on this device', syncing:'Syncing…', offline:'Offline · will sync later',
    error:'Sync failed · tap to retry', ok:'Synced ' + new Date(P.lastSync || Date.now()).toLocaleTimeString('en-GB', { hour:'2-digit', minute:'2-digit' }) })[s];
  t.textContent = label; chip.setAttribute('aria-label', label); chip.title = msg || label;
  const st = $('sheetStatus'); if (st) st.textContent = sheetStatusText();
}
function sheetStatusText(){
  if (!P.url) return 'Not connected. Your entries are saved on this device only.';
  if (UI.sync === 'error') return 'Last try failed: ' + UI.syncMsg;
  if (P.lastSync) return 'Connected. Last synced ' + new Date(P.lastSync).toLocaleString('en-GB', { day:'numeric', month:'short', hour:'2-digit', minute:'2-digit' }) + '.';
  return 'Connected. Not synced yet.';
}

/* ================= sound (made in the browser, no files) ================= */
const Sound = {
  ctx:null, master:null, wet:null, pad:null,
  init(){
    if (this.ctx) return;
    const AC = window.AudioContext || window.webkitAudioContext; if (!AC) return;
    try {
      const c = this.ctx = new AC();
      const comp = c.createDynamicsCompressor(); comp.connect(c.destination);
      this.master = c.createGain(); this.master.gain.value = .9; this.master.connect(comp);
      const conv = c.createConvolver(); conv.buffer = this.impulse(c, 2.4); conv.connect(comp);
      this.wet = c.createGain(); this.wet.gain.value = .35; this.wet.connect(conv);
    } catch(e){ this.ctx = null; }
  },
  impulse(c, sec){
    const len = Math.floor(c.sampleRate * sec), b = c.createBuffer(2, len, c.sampleRate);
    for (let ch = 0; ch < 2; ch++){ const d = b.getChannelData(ch); for (let i = 0; i < len; i++) d[i] = (Math.random()*2-1) * Math.pow(1 - i/len, 3); }
    return b;
  },
  ready(){ if (!P.sound) return false; this.init(); if (!this.ctx) return false; if (this.ctx.state === 'suspended') this.ctx.resume(); return true; },
  out(g, wet){ g.connect(this.master); if (wet){ const s = this.ctx.createGain(); s.gain.value = wet; g.connect(s); s.connect(this.wet); } },
  tone(f, o = {}){
    const c = this.ctx, now = c.currentTime + (o.t || 0), dur = o.dur || .6, gain = o.gain || .08;
    const osc = c.createOscillator(), g = c.createGain();
    osc.type = o.type || 'sine'; osc.frequency.setValueAtTime(f, now);
    if (o.to) osc.frequency.exponentialRampToValueAtTime(o.to, now + dur);
    g.gain.setValueAtTime(0, now); g.gain.linearRampToValueAtTime(gain, now + (o.attack || .006)); g.gain.exponentialRampToValueAtTime(.0001, now + dur);
    osc.connect(g); this.out(g, o.wet ?? .5); osc.start(now); osc.stop(now + dur + .05);
  },
  bell(f, o = {}){ const g = o.gain || .1, d = o.dur || 1;
    this.tone(f, o); this.tone(f*2.01, { ...o, gain:g*.32, dur:d*.6 }); this.tone(f*3.97, { ...o, gain:g*.1, dur:d*.35 }); },
  whoosh(up){
    const c = this.ctx, now = c.currentTime, len = .38;
    const buf = c.createBuffer(1, Math.floor(c.sampleRate*len), c.sampleRate), d = buf.getChannelData(0);
    for (let i = 0; i < d.length; i++) d[i] = Math.random()*2-1;
    const src = c.createBufferSource(); src.buffer = buf;
    const bp = c.createBiquadFilter(); bp.type = 'bandpass'; bp.Q.value = 1.4;
    bp.frequency.setValueAtTime(up ? 500 : 1600, now); bp.frequency.exponentialRampToValueAtTime(up ? 1700 : 480, now + len);
    const g = c.createGain(); g.gain.setValueAtTime(0, now); g.gain.linearRampToValueAtTime(.045, now + .1); g.gain.exponentialRampToValueAtTime(.0001, now + len);
    src.connect(bp); bp.connect(g); this.out(g, .4); src.start(now); src.stop(now + len);
  },
  play(name, a, b){
    if (!this.ready()) return;
    const N = a && CH[a] ? CH[a].note : 440;
    switch (name){
      case 'tap':     this.tone(780, { dur:.1, gain:.04, wet:.15 }); break;
      case 'tab':     this.bell(659, { dur:.5, gain:.045 }); break;
      case 'pick':    this.bell(N, { dur:1.2, gain:.1 }); this.bell(N*1.5, { t:.08, dur:1, gain:.045 }); break;
      case 'unpick':  this.bell(N/2, { dur:.5, gain:.06, wet:.3 }); break;
      case 'chipOn':  this.tone(1046, { dur:.2, gain:.045 }); this.tone(1568, { t:.04, dur:.15, gain:.02 }); break;
      case 'chipOff': this.tone(698, { dur:.14, gain:.035 }); break;
      case 'level':   this.bell(N * [1, 1, 1.125, 1.25, 1.5, 2][b || 1], { dur:.7, gain:.07 }); break;
      case 'slideR':  this.whoosh(true); break;
      case 'slideL':  this.whoosh(false); break;
      case 'open':    [523.25, 659.25, 783.99].forEach((f,k) => this.bell(f, { t:k*.09, dur:1, gain:.05 })); break;
      case 'remove':  this.tone(523, { dur:.25, gain:.05, to:330 }); break;
      case 'done':    CHAKRAS.forEach((c,k) => this.bell(c.note, { t:k*.14, dur:1.8, gain:.065 })); this.bell(1046.5, { t:1.05, dur:2.4, gain:.05 }); break;
      case 'sync':    this.bell(880, { dur:.5, gain:.035 }); this.bell(1318.5, { t:.1, dur:.6, gain:.03 }); break;
      case 'error':   this.tone(233, { dur:.45, gain:.05, type:'triangle', to:196 }); break;
      case 'welcome': [392, 493.88, 587.33].forEach(f => this.bell(f, { dur:2.2, gain:.04 })); break;
    }
  },
  // soft background sound for the garden: rain, wind, water, birds, crickets
  ambient(L){
    if (!L || !P.sound){ this.ambStop(); return; }
    if (!this.ready()) return;
    const c = this.ctx;
    if (!this.amb){
      const len = c.sampleRate * 2, buf = c.createBuffer(1, len, c.sampleRate), d = buf.getChannelData(0); let last = 0;
      for (let i = 0; i < len; i++){ const x = Math.random() * 2 - 1; last = (last + .02 * x) / 1.02; d[i] = x * .5 + last * 3; }
      const mk = (type, f, q) => { const src = c.createBufferSource(); src.buffer = buf; src.loop = true; src.playbackRate.value = .85 + Math.random() * .3;
        const fl = c.createBiquadFilter(); fl.type = type; fl.frequency.value = f; fl.Q.value = q; const g = c.createGain(); g.gain.value = 0;
        src.connect(fl); fl.connect(g); g.connect(this.master); src.start(); return { src, fl, g }; };
      const A = this.amb = { rain:mk('highpass', 1500, .4), wind:mk('lowpass', 380, .9), water:mk('lowpass', 260, .6) };
      const lfo = (f, depth, target) => { const o = c.createOscillator(), g = c.createGain(); o.frequency.value = f; g.gain.value = depth; o.connect(g); g.connect(target); o.start(); return o; };
      A.l1 = lfo(.13, 170, A.wind.fl.frequency); A.l2 = lfo(.19, .006, A.water.g.gain);
      A.tick = setInterval(() => this.ambTick(), 1000);
    }
    const A = this.amb, now = c.currentTime; A.L = L;
    A.rain.g.gain.setTargetAtTime(L.rain * .045, now, .8);
    A.wind.g.gain.setTargetAtTime(L.wind * .05, now, .8);
    A.water.g.gain.setTargetAtTime(.01 + L.water * .016, now, .8);
  },
  ambTick(){
    const A = this.amb; if (!A || !P.sound || !this.ctx || document.hidden) return; const L = A.L;
    if (Math.random() < L.birds * .45){ const f = 2300 + Math.random() * 1300, n = 1 + Math.floor(Math.random() * 3); for (let k = 0; k < n; k++) this.tone(f * (1 + k * .04), { t:k * .1, dur:.09, gain:.014, to:f * 1.3, wet:.35 }); }
    if (Math.random() < L.crickets * .5) for (let k = 0; k < 5; k++) this.tone(4300, { t:k * .05, dur:.025, gain:.006, wet:.2 });
  },
  ambStop(){

/* ----- my day: the body map ----- */
const MAP_Y = { crown:47, third:82, throat:140, heart:195, solar:245, sacral:291, root:333 };
function orbR(x){ return x.n ? 10 + Math.min(x.score, 20) * 1.05 : 5; }
function mapHTML(items, t, conn){
  const d = S.days[UI.date];
  const dom = CHAKRAS.slice().sort((a,b) => t[b.id].score - t[a.id].score)[0];
  let defs = `<linearGradient id="figfill" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fff" stop-opacity=".18"/><stop offset="1" stop-color="#fff" stop-opacity=".05"/></linearGradient>
    <radialGradient id="aura" cx="50%" cy="48%" r="50%"><stop offset="0" stop-color="${dom.c}" stop-opacity=".35"/><stop offset="1" stop-color="${dom.c}" stop-opacity="0"/></radialGradient>`
    + CHAKRAS.map(c => `<radialGradient id="gl-${c.id}"><stop offset="0" stop-color="${c.c}" stop-opacity=".75"/><stop offset=".45" stop-color="${c.c}" stop-opacity=".25"/><stop offset="1" stop-color="${c.c}" stop-opacity="0"/></radialGradient>`).join('');
  let arcs = '';
  conn.filter(c => c.pair).forEach((c,k) => {
    const y1 = MAP_Y[c.pair[0]], y2 = MAP_Y[c.pair[1]], side = k % 2 ? 1 : -1, bx = 180 + side * (46 + Math.abs(y2 - y1) * .3);
    defs += `<linearGradient id="arc-${k}" gradientUnits="userSpaceOnUse" x1="180" y1="${y1}" x2="180" y2="${y2}"><stop offset="0" stop-color="${CH[c.pair[0]].light}"/><stop offset="1" stop-color="${CH[c.pair[1]].light}"/></linearGradient>`;
    arcs += `<path class="arc" d="M180 ${y1} Q ${bx} ${(y1+y2)/2} 180 ${y2}" stroke="url(#arc-${k})"/>`;
  });
  let orbs = '';
  CHAKRAS.forEach(c => {
    const x = t[c.id], y = MAP_Y[c.id], r = orbR(x);
    if (!x.n){ orbs += `<circle cx="180" cy="${y}" r="5" fill="${c.c}" opacity=".4"/>`; return; }
    const o = Math.round(100 * x.open / x.n), rr = r + 5;
    orbs += `<circle class="glow" cx="180" cy="${y}" r="${(r*2).toFixed(1)}" fill="url(#gl-${c.id})"/><circle cx="180" cy="${y}" r="${r.toFixed(1)}" fill="url(#g-${c.id})"/>`;
    if (o) orbs += `<circle class="ringo" cx="180" cy="${y}" r="${rr.toFixed(1)}" stroke="${c.light}" pathLength="100" stroke-dasharray="${o} ${100-o}" transform="rotate(-90 180 ${y})"/>`;
    if (o < 100){ const n = Math.max(3, Math.round((100 - o) / 100 * 2 * Math.PI * rr / 6.5));
      for (let j = 0; j < n; j++){ const a = -Math.PI/2 + (o + (100 - o) * (j + .5) / n) / 100 * 2 * Math.PI;
        orbs += `<circle cx="${(180 + Math.cos(a)*rr).toFixed(1)}" cy="${(y + Math.sin(a)*rr).toFixed(1)}" r="1.9" fill="${c.light}"/>`; } }
  });
  const svg = `<svg class="mapsvg" viewBox="0 0 360 440" aria-hidden="true"><defs>${defs}</defs>
    <ellipse cx="180" cy="215" rx="175" ry="215" fill="url(#aura)"/>
    <g class="fig" transform="translate(42 20) scale(2.3)"><circle cx="60" cy="28" r="17"/><path d="M60 47 C42 47 34 60 32 88 C30 108 35 124 40 136 L20 152 C13 159 20 168 32 165 L60 156 L88 165 C100 168 107 159 100 152 L80 136 C85 124 90 108 88 88 C86 60 78 47 60 47Z"/></g>
    <line class="spine" x1="180" y1="${MAP_Y.crown}" x2="180" y2="${MAP_Y.root}"/>${arcs}${orbs}</svg>`;
  let btns = '';
  CHAKRAS.forEach(c => {
    const x = t[c.id], y = MAP_Y[c.id]; if (!x.n) return;
    const ids = d.order.filter(id => F[id].ch === c.id), top = (y / 440 * 100).toFixed(2) + '%';
    btns += `<button class="maporb" data-act="openCard" data-id="${ids[0]}" style="left:50%;top:${top};width:${((orbR(x)*2 + 12) / 360 * 100).toFixed(2)}%" aria-label="${c.name}: ${x.n} ${x.n === 1 ? 'feeling' : 'feelings'}, ${x.open} open, ${x.prot} protective"></button>`;
    ids.slice(0, 6).forEach((id,k) => {
      const side = k % 2 ? 1 : -1, slot = Math.floor(k / 2), px = 180 + side * (80 + slot * 40), it = d.items[id], more = k === 5 && ids.length > 6;
      btns += `<button class="mapfeel ${it.stay === 'stay' ? 'stay' : ''} ${it.stay === 'push' ? 'push' : ''}" data-act="openCard" data-id="${more ? ids[5] : id}" style="left:${(px / 360 * 100).toFixed(2)}%;top:${top};--c:${c.c}" aria-label="${F[id].name}${written(it) ? ', written about' : ''}${it.stay === 'push' ? ', pushed away' : ''}${more ? ', and ' + (ids.length - 5) + ' more' : ''}">${blob(id)}${written(it) ? '<span class="pen" aria-hidden="true">✎</span>' : ''}${more ? `<span class="more" aria-hidden="true">+${ids.length - 5}</span>` : ''}</button>`;
    });
  });
  return `<div class="map">${svg}${btns}</div>`;
}

const BR = { on:false, timers:[] };
function stopBreath(){
  BR.timers.forEach(clearTimeout); BR.timers = [];
  if (BR.on){ BR.on = false; Sound.breath('end'); }
  const el = $('breath'); if (!el) return;
  el.dataset.phase = 'idle'; $('bword').textContent = 'Ready when you are'; $('bcount').textContent = '';
  $('ringFg').style.transitionDuration = '.6s'; $('ringFg').style.strokeDashoffset = 100; setParts(el, 'far', .6);
  const b = $('breathBtn'); if (b) b.textContent = '🫧 Breathe with me';
}
function setParts(el, where, dur){
  const size = el.offsetWidth, r = where === 'near' ? size * .25 : size * .5;
  el.querySelectorAll('.parts i').forEach(p => { p.style.transitionDuration = dur + 's'; p.style.transform = `rotate(${p.style.getPropertyValue('--a')}) translateX(${r}px)`; p.style.opacity = where === 'near' ? 1 : .55; });
}
function breathe(){
  if (BR.on){ stopBreath(); return; }
  const el = $('breath'); if (!el) return;
  BR.on = true; $('breathBtn').textContent = '■ Stop';
  const seq = []; for (let k = 0; k < BREATH_CYCLES; k++) BREATH.forEach(p => seq.push([...p, k + 1]));
  let at = 0;
  seq.forEach(([ph, word, dur, cyc]) => {
    BR.timers.push(setTimeout(() => {
      if (!el.isConnected) return stopBreath();
      el.dataset.phase = ph; el.querySelector('.orb').style.transitionDuration = dur + 's';
      $('bword').textContent = word; const ring = $('ringFg'); ring.style.transitionDuration = dur + 's';
      if (ph === 'in'){ ring.style.strokeDashoffset = 0; setParts(el, 'near', dur); }
      if (ph === 'out'){ ring.style.strokeDashoffset = 100; setParts(el, 'far', dur); }
      Sound.breath(ph, dur);
      for (let s = 0; s < dur; s++) BR.timers.push(setTimeout(() => { if ($('bcount')) $('bcount').textContent = dur - s; }, s * 1000));
    }, at * 1000));
    at += dur;
  });
  BR.timers.push(setTimeout(() => {
    BR.on = false; Sound.breath('end'); Sound.play('welcome');
    if (!el.isConnected) return;
    el.dataset.phase = 'idle'; $('bword').textContent = 'Welcome back'; $('bcount').textContent = '';
    const bq = $('bodyQ'); if (bq){ bq.classList.remove('pulse'); void bq.offsetWidth; bq.classList.add('pulse'); }
    $('breathBtn').textContent = '🫧 Breathe again';
  }, at * 1000));
}

function download(name, text, type){
  const a = Object.assign(document.createElement('a'), { href:URL.createObjectURL(new Blob([text], { type })), download:name });
  document.body.appendChild(a); a.click(); a.remove(); setTimeout(() => URL.revokeObjectURL(a.href), 1500);
}
function exportCsv(){
  const rows = Object.keys(S.days).sort().flatMap(rowsFor).map(r => r.map((v,i) => i === 10 ? new Date(+v).toISOString() : v));
  const cell = v => { v = String(v ?? ''); if (/^[=+\-@]/.test(v)) v = "'" + v; return /[",\n\r]/.test(v) ? '"' + v.replace(/"/g,'""') + '"' : v; };
  download(`feelings-journal-${todayKey()}.csv`, '﻿' + [HEAD, ...rows].map(r => r.map(cell).join(',')).join('\r\n'), 'text/csv;charset=utf-8');
}
